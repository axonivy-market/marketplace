name: marketplace

services:
  ui:
    container_name: ${UI_CONTAINER_NAME:-market-ui-latest}
    image: ghcr.io/axonivy-market/marketplace-ui:${RELEASE_VERSION}
    env_file:
      - ${MARKET_ENV_FILE:-.env}
    volumes:
      - marketbrowser:/browser_share
    restart: always
    command: sh -c "cp -r /app/dist/browser/* /browser_share && node dist/server/server.mjs"
    expose:
      - 4000
    networks:
      - marketplace-network

  app:
    container_name: ${APP_CONTAINER_NAME:-market-app-latest}
    image: ghcr.io/axonivy-market/marketplace-app:${RELEASE_VERSION}
    restart: always
    volumes:
      - marketcache:/app/data/market-cache
      - ${APP_LOG_PATH}:/app/logs
    env_file:
      - ${MARKET_ENV_FILE:-.env}
    expose:
      - 8080
    networks:
      - marketplace-network

  stable:
    container_name: ${STABLE_CONTAINER_NAME:-market-stable-latest}
    image: ghcr.io/axonivy-market/marketplace-stable:${RELEASE_VERSION}
    restart: always
    volumes:
      - ${STABLE_LOG_PATH}:/app/logs
    env_file:
      - ${MARKET_ENV_FILE:-.env}
    expose:
      - 8085
    networks:
      - marketplace-network

networks:
  marketplace-network:
    external: true

volumes:
  marketcache:
    name: marketplace_marketcache
    external: true
  marketbrowser:
    name: marketplace_marketbrowser
    external: true
