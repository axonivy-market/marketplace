name: marketplace

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-stable}
    restart: always
    volumes:
      - ${NGINX_CONFIG_PATH}:/etc/nginx/nginx.conf
      - ${NGINX_CACHE_PATH}:/usr/share/nginx/html/cache
      - ${NGINX_LOG_PATH}:/var/log/nginx
      - marketcache:/usr/share/nginx/html/market-cache:ro
      - marketbrowser:/usr/share/nginx/html/browser:ro
    ports:
      - "${NGINX_PORT}:80"
    networks:
      - marketplace-network

networks:
  marketplace-network:
    external: true

volumes:
  marketcache:
    name: marketplace_marketcache
    external: true
  marketbrowser:
    name: marketplace_marketbrowser
    external: true
