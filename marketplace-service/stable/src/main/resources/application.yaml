server:
  port: '8085'
  forward-headers-strategy: framework
  servlet:
    context-path: /stable
    session:
      cookie:
        secure: 'true'
  tomcat:
    connection-timeout: 240000ms
    threads:
      max: '200'
    max-swallow-size: '-1'

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: '${POSTGRES_HOST_URL}'
    username: '${POSTGRES_USERNAME}'
    password: '${POSTGRES_PASSWORD}'
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

market:
  info:
    title: "Marketplace stable"
    description: "The stable public api"
    version: '${BUILD_VERSION}'
  cors:
    allowed:
      origin:
        patterns: '${MARKET_CORS_ALLOWED_ORIGIN}'
        max-age: '3600'
      mappings: '${MARKET_CORS_ALLOWED_MAPPINGS:/**}'
      methods: '${MARKET_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}'
  encryption:
    key: '${MARKET_ENCRYPTION_SECRET_KEY}'
    salt: '${MARKET_ENCRYPTION_SALT}'

cache:
  default:
    expired-minutes: '${CACHE_DEFAULT_EXPIRED_MINUTES:60}'
    maximum-size: '${CACHE_DEFAULT_MAXIMUM_SIZE:1000}'
  products:
    expired-minutes: '${CACHE_PRODUCTS_EXPIRED_MINUTES:5}'
    details:
      expired-minutes: '${CACHE_PRODUCTS_DETAILS_EXPIRED_MINUTES:1}'
      github-releases:
        expired-minutes: '${CACHE_PRODUCTS_DETAILS_GITHUB_RELEASES_EXPIRED_MINUTES:10}'

springdoc:
  api-docs:
    path: /api-docs
    version: OPENAPI_3_1

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
