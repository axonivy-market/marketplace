name: Market-Service CI Build
run-name: Execute tests for Market-Service on branch ${{github.ref_name}} triggered by ${{github.actor}}

on:
  pull_request:
    paths:
      - 'marketplace-service/**'
  push:
    paths:
      - 'marketplace-service/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build and run tests
        run: mvn -B verify --file ./marketplace-service/pom.xml